data:
    value:
        dataset:
            frameskip: 5
            keys_to_cache:
                - action
                - proprio
                - state
            keys_to_load:
                - pixels
                - action
                - proprio
                - state
            name: pusht_expert_train
            num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
dump_object:
    value: true
encoder_scale:
    value: tiny
img_size:
    value: 224
loader:
    value:
        batch_size: 128
        num_workers: ${num_workers}
        persistent_workers: true
        pin_memory: true
        prefetch_factor: 6
loss:
    value:
        sigreg:
            kwargs:
                knots: 17
                num_proj: 1024
            weight: 0.09
num_workers:
    value: 14
optimizer:
    value:
        lr: 5e-05
        type: AdamW
        weight_decay: 0.001
output_model_name:
    value: lewm
patch_size:
    value: 14
predictor:
    value:
        depth: 6
        dim_head: 64
        dropout: 0.1
        emb_dropout: 0
        heads: 16
        mlp_dim: 2048
seed:
    value: 3072
slurm.job_id:
    value: "35104321"
slurm.task_id:
    value: N/A
subdir:
    value: ${hydra:job.id}
system.working_dir:
    value: /mmfs1/gscratch/rao/alexchin/le-wm
train_split:
    value: 0.9
trainer:
    value:
        accelerator: gpu
        devices: auto
        gradient_clip_val: 1
        max_epochs: 100
        precision: bf16
wandb:
    value:
        config:
            entity: jepa-experiments
            id: ${subdir}
            log_model: false
            name: ${output_model_name}
            project: lewm-pusht
            resume: allow
        enabled: true
wm:
    value:
        action_dim: 2
        embed_dim: 192
        history_size: 3
        num_preds: 1
        proprio_dim: 4
        state_dim: 7
        type: lewm
